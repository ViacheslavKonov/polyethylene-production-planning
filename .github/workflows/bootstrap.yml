name: Import initial project sources
on:
  push:
    branches: [main]
    paths: [".bootstrap/source.tar.xz", ".github/workflows/bootstrap.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and unpack starter
        shell: bash
        run: |
          set -euo pipefail
          echo "5a75ce1466421f8251400789b1446d819f8eeb1c02ad680bd6d0657b3dcad5a8  .bootstrap/source.tar.xz" | sha256sum -c -
          tar -xJf .bootstrap/source.tar.xz
          rm -rf .bootstrap
          rm .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: import complete Portainer/Codex starter"
            git push origin HEAD:main
          fi
