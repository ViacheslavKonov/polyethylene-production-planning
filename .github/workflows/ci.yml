name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Pytest
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: pytest -q
      - name: Compile sources
        run: python -m compileall -q app alembic tests
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check development compose syntax
        run: docker compose -f compose.dev.yaml config -q
      - name: Check Portainer compose syntax
        env:
          POSTGRES_DB: pe_planning
          POSTGRES_USER: pe_planning
          POSTGRES_PASSWORD: sample-only-not-a-real-secret
        run: docker compose -f compose.yaml config -q
      - name: Check prototype compose syntax
        env:
          POSTGRES_PASSWORD: sample-only-not-a-real-secret
        run: docker compose -f compose.prototype.yaml config -q
