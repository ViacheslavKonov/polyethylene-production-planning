name: Feature implementation
description: Implement a PE-xxx requirement slice
labels: [enhancement]
body:
  - type: input
    id: task
    attributes:
      label: Work item
      placeholder: PE-001
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Source requirements and acceptance criteria
      description: Cite docs/REQUIREMENTS.md and docs/WORK_ITEMS.md
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Proposed tests and Portainer impact
    validations:
      required: true
