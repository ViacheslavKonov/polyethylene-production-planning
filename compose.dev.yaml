# Local development: docker compose -f compose.dev.yaml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pe_planning
      POSTGRES_USER: pe_planning
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      retries: 20
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: pe_planning
      DB_USER: pe_planning
      DB_PASSWORD: local-dev-only
    ports:
      - '127.0.0.1:8088:8000'
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata_dev:
