# Portainer Stack: deploy from this Git repository after the GHCR image is published.
# Deliberately NOT exposed publicly by default; login/RBAC/TLS aren't implemented yet.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    security_opt: [no-new-privileges:true]
  app:
    image: ${APP_IMAGE:-ghcr.io/viacheslavkonov/polyethylene-production-planning:main}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:8000'
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp
    # No docker socket, host mounts or privileged mode.
networks:
  backend:
    driver: bridge
volumes:
  pgdata:
